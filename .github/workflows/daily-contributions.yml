name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make daily contributions
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          for i in {1..10}
          do
            echo "Daily contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: automated daily contribution $i"
          done

          git push origin main
