name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create 10 commits
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          for i in {1..10}
          do
            echo "Contribution on $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: daily contribution $i"
          done

          git push origin main
