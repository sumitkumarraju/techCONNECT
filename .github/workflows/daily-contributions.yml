name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate dummy commits
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"

          for i in {1..10}
          do
            echo "Contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Auto contribution $i on $(date +'%Y-%m-%d')"
          done

      - name: Push changes
        run: git push origin main
