name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate 10 dummy commits
        run: |
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

          for i in {1..10}
          do
            echo "Contribution on $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated contribution $(date +'%Y-%m-%d %H:%M:%S') - $i"
          done

          git push origin main
