name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Generate 10 Commits
        run: |
          for i in {1..10}
          do
            echo "Contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated contribution $(date +'%Y-%m-%d %H:%M:%S') - $i/10"
          done

      - name: Push changes
        run: git push origin main
