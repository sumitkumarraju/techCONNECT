name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main # Ensure we check out the main branch

      - name: Setup Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Make 10 dummy commits
        run: |
          for i in {1..10}
          do
            echo "Daily contribution - $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated daily contribution $i on $(date)"
          done

      - name: Push changes
        run: |
          git push origin main
