name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Make 10 Commits
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          for i in {1..10}
          do
            echo "Contribution log entry: $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: daily contribution graph update $i"
          done

          git push origin main
