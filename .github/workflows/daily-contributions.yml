name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Make 10 contributions
        run: |
          for i in {1..10}
          do
            echo "Contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated contribution $i on $(date)"
          done

      - name: Push changes
        run: git push origin main
