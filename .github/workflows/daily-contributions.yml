name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - name: Make 10 commits
        run: |
          for i in {1..10}; do
            echo "Contribution on $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: dummy daily contribution $i"
          done

      - name: Push changes
        run: git push origin main
