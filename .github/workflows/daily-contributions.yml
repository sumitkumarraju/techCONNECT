name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Make 10 commits
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          for i in {1..10}; do
            echo "Contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated contribution $i"
          done

          git push origin main
