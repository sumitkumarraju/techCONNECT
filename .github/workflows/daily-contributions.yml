name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Generate Dummy Commits
        run: |
          for i in {1..10}; do
            echo "Daily contribution $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Daily contribution $(date) - commit $i"
          done

      - name: Push changes
        run: |
          git push origin main
