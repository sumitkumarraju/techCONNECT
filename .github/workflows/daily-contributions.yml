name: Daily Contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Git identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Make 10 commits
        run: |
          for i in {1..10}
          do
            echo "Automated contribution: $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: automated daily contribution ($i/10)"
          done

      - name: Push changes
        run: git push origin main
