name: Daily Contributions
on:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate commits
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          for i in {1..10}
          do
            echo "Daily contribution - $(date) - $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated daily contribution $i"
          done

          git push origin main
