name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Git Configuration
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Make 10 Daily Commits
        run: |
          for i in {1..10}; do
            echo "Automated contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: automated daily contribution $i"
          done

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
