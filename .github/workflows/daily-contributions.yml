name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make 10 daily contributions
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"

          for i in {1..10}
          do
            echo "Contribution $i on $(date)" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "chore: automated daily contribution $i"
          done

          git push origin main
