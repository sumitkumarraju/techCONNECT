name: Daily Contributions

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make 10 commits
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          for i in {1..10}
          do
            echo "Contribution on $(date) - commit $i" >> contribution-log.txt
            git add contribution-log.txt
            git commit -m "Automated contribution: commit $i on $(date)"
          done

          git push origin main
